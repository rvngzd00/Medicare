name: Deploy Medicare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: medicare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to cPanel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}

        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/medicare_actions
          chmod 600 ~/.ssh/medicare_actions

          for attempt in 1 2 3; do
            echo "SSH attempt: $attempt"

            if ssh \
              -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=1 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              -i ~/.ssh/medicare_actions \
              medicarehospital@94.20.248.25 \
              '/home/medicarehospital/deploy-medicare.sh'
            then
              echo "Deployment successful"
              exit 0
            fi

            echo "SSH failed. Retrying..."
            sleep 20
          done

          echo "Deployment failed after 3 attempts"
          exit 1
